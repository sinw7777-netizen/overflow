<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>편입 준비 한눈에 - AI 편입 비서</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-wrapper">
  <!-- 상단 헤더: 브랜드 및 로그인/사용자 칩 -->
  <header>
    <div class="brand">
      <div class="brand-icon">P</div>
      편입 준비 한눈에
    </div>
    <div class="header-auth-box" id="headerAuthArea"></div>
  </header>

  <!-- 메인 동적 화면 컨테이너 -->
  <main id="appScreen" aria-live="polite"></main>

  <!-- 하단 탭 내비게이션 (은은한 회색 톤 분리) -->
  <nav class="nav-bottom-bar" aria-label="메인 탭 메뉴">
    <button class="nav-tab-btn active" data-page="home"><span class="nav-icon">⌂</span>홈</button>
    <button class="nav-tab-btn" data-page="list"><span class="nav-icon">▤</span>준비사항</button>
    <button class="nav-tab-btn" data-page="check"><span class="nav-icon">☑</span>체크리스트</button>
    <button class="nav-tab-btn" data-page="profile"><span class="nav-icon">○</span>설정</button>
  </nav>

  <!-- 로그인 전용 모달 -->
  <div class="login-modal-overlay" id="loginOverlay">
    <div class="login-modal-window">
      <div class="login-modal-header">
        <h3>수험생 로그인</h3>
        <button class="btn-close-modal" onclick="closeLoginModal()" aria-label="닫기">✕</button>
      </div>
      <p class="sub" style="margin-bottom:14px">로그인 시 목표 대학과 준비 현황이 계정에 안전하게 동기화됩니다.</p>
      <div class="login-fields">
        <input type="text" id="loginId" placeholder="아이디" value="overflow7777">
        <input type="password" id="loginPw" placeholder="비밀번호" value="12345678">
      </div>
      <label class="login-agree-label">
        <input type="checkbox" id="loginAgree" checked>
        <span>[필수] 개인정보 수집 및 이용에 동의합니다.</span>
      </label>
      <button class="btn" style="margin-top:10px;margin-bottom:8px" onclick="executeLogin()">로그인하기</button>
      <button class="btn secondary" style="min-height:42px;font-size:13px" onclick="quickDemoLogin()">⚡ '오버플로우' 계정으로 1초 로그인</button>
    </div>
  </div>

  <!-- AI 입학처 탐색 시뮬레이션 모달 -->
  <div class="ai-modal-overlay" id="aiOverlay">
    <div class="ai-modal-window">
      <div class="ai-spinner-ring"></div>
      <h3 id="aiModalHeading" style="font-size:16px;margin-bottom:6px">AI 비서 요강 분석 중...</h3>
      <p id="aiModalDetail" style="font-size:12.5px;color:var(--ink-500);margin-bottom:16px">입학처 최신 편입 공지사항을 스캔하고 있습니다.</p>
      <div class="progress-track">
        <div class="progress-fill" id="aiModalBar" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- 알림 토스트 -->
  <div class="toast-msg" id="toastMsg">저장되었습니다.</div>
</div>

<script src="js/app.js"></script>
</body>
</html>
